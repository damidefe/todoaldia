<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autos @l Día — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-texto {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -1px;
        }
        .logo-texto span { color: #E31E24; }
        .logo-sub {
            font-size: 9px;
            color: #333;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 9px;
            font-weight: 900;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus { border-color: #E31E24; }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #E31E24;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-login:hover { background: #c41a1f; }
        .error {
            background: rgba(227,30,36,0.1);
            border: 1px solid #E31E24;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 11px;
            color: #E31E24;
            font-weight: 700;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <div class="logo-texto">TODO <span>@L</span> DÍA</div>
            <div class="logo-sub">26 años de confianza · Caballito</div>
        </div>

        {% if form.errors %}
        <div class="error">Usuario o contraseña incorrectos.</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="field">
                <label>Usuario</label>
                <input type="text" name="username" autofocus autocomplete="username">
            </div>
            <div class="field">
                <label>Contraseña</label>
                <input type="password" name="password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Entrar →</button>
        </form>
    </div>
</body>
</html>
